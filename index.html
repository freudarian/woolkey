<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WoolKey — Strong passwords. Made privately.</title>
  <meta name="description" content="WoolKey generates secure passwords and passphrases entirely in your browser. Nothing is ever sent to our servers.">
  <meta name="theme-color" content="#0f1117">
  <link rel="icon" type="image/png" href="assets/favicon.png">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="css/main.css?v=4">
  <link rel="stylesheet" href="css/fireflies.css?v=4">
</head>
<body class="scenic">

<header class="site-header">
  <a href="./" class="logo" aria-label="WoolKey home"><img src="assets/logo.gif" alt="" width="28" height="28"><span>WoolKey</span></a>
  <div class="theme-switcher" role="group" aria-label="Theme">
    <button type="button" class="theme-btn" data-theme-choice="light" aria-label="Light mode" title="Light mode">☀️</button>
    <button type="button" class="theme-btn" data-theme-choice="dark" aria-label="Dark mode" title="Dark mode">🌙</button>
    <button type="button" class="theme-btn" data-theme-choice="system" aria-label="System theme" title="System theme">💻</button>
  </div>
</header>

<main id="main-content">
  <div class="card">
    <!-- Mode toggle -->
    <div class="mode-toggle" role="group" aria-label="Generator mode">
      <button id="mode-password" class="active" aria-pressed="true">Password</button>
      <button id="mode-passphrase" aria-pressed="false">Passphrase</button>
    </div>

    <!-- Output -->
    <div class="output-wrapper" aria-live="polite" aria-label="Generated output">
      <span id="output" tabindex="0" role="textbox" aria-readonly="true" aria-label="Generated password or passphrase"></span>
      <button id="toggle-visibility" class="visibility-btn" type="button" aria-pressed="true" aria-label="Show password">
        <svg id="icon-eye-off" xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
        <svg id="icon-eye" xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
      </button>
    </div>

    <!-- Actions -->
    <div class="actions">
      <button id="regen-btn" class="btn btn-primary" aria-label="Generate new password">
        ↺ Generate
      </button>
      <button id="copy-btn" class="btn btn-outline" aria-label="Copy to clipboard">
        ⎘ Copy
      </button>
      <span id="copy-feedback" class="copy-feedback" role="status" aria-live="polite">Copied!</span>
    </div>

    <!-- Strength indicator -->
    <div class="strength-track" aria-hidden="true">
      <div id="strength-bar" class="strength-bar level-0"></div>
    </div>
    <div class="strength-row">
      <span id="entropy-display" class="entropy-display">Estimated entropy: —</span>
      <span id="strength-label" class="strength-label level-0" aria-live="polite">—</span>
    </div>

    <!-- Password options panel -->
    <div id="password-panel" class="options-section" aria-label="Password options">
      <h2>Options</h2>
      <div class="option-row">
        <label for="length">Length</label>
        <input type="range" id="length" min="8" max="128" value="24" step="1" aria-valuemin="8" aria-valuemax="128" aria-valuenow="24">
        <span id="length-value" class="option-value" aria-live="polite">24</span>
      </div>
      <div class="toggle-group" role="group" aria-label="Character types">
        <label class="chk-label">
          <input type="checkbox" id="chk-lower" checked> a–z
        </label>
        <label class="chk-label">
          <input type="checkbox" id="chk-upper" checked> A–Z
        </label>
        <label class="chk-label">
          <input type="checkbox" id="chk-numbers" checked> 0–9
        </label>
        <label class="chk-label">
          <input type="checkbox" id="chk-symbols"> !@#…
        </label>
        <label class="chk-label">
          <input type="checkbox" id="chk-ambiguous"> Avoid ambiguous
        </label>
      </div>
      <div class="field-row">
        <label for="exclude-chars">Exclude characters</label>
        <input type="text" id="exclude-chars" placeholder="e.g. @#&" autocomplete="off" spellcheck="false" aria-label="Characters to exclude from password">
      </div>
    </div>

    <!-- Passphrase options panel (hidden initially) -->
    <div id="passphrase-panel" class="options-section" aria-label="Passphrase options" hidden>
      <h2>Options</h2>
      <div class="option-row">
        <label for="word-count">Words</label>
        <input type="range" id="word-count" min="4" max="8" value="4" step="1" aria-valuemin="4" aria-valuemax="8" aria-valuenow="4">
        <span id="word-count-value" class="option-value" aria-live="polite">4</span>
      </div>
      <div class="field-row">
        <label for="separator">Separator</label>
        <select id="separator" aria-label="Word separator">
          <option value="hyphen">Hyphen  ( - )</option>
          <option value="underscore">Underscore  ( _ )</option>
          <option value="dot">Dot  ( . )</option>
          <option value="space">Space</option>
        </select>
      </div>
      <div class="toggle-group" role="group" aria-label="Passphrase options">
        <label class="chk-label">
          <input type="checkbox" id="chk-capitalize"> Capitalize
        </label>
        <label class="chk-label">
          <input type="checkbox" id="chk-add-number"> Add number
        </label>
      </div>
    </div>

    <p class="privacy-badge">
      <strong>Generated locally.</strong> Nothing leaves your browser.
    </p>
  </div>
</main>

<footer class="site-footer">
  <span>© <span data-current-year></span> CoolerSheep</span>
  <a href="privacy.html">Privacy</a>
  <a href="security.html">Security</a>
  <a href="api.html" class="link-ai">
    <svg class="ai-star" viewBox="0 0 24 24" aria-hidden="true"><path d="M11 1.5l1.7 4.9a4.5 4.5 0 0 0 2.9 2.9l4.9 1.7-4.9 1.7a4.5 4.5 0 0 0-2.9 2.9L11 20.5l-1.7-4.9a4.5 4.5 0 0 0-2.9-2.9L1.5 11l4.9-1.7a4.5 4.5 0 0 0 2.9-2.9z"/><path d="M18.5 15.5l.7 2 2 .7-2 .7-.7 2-.7-2-2-.7 2-.7z"/></svg>
    API
  </a>
</footer>

<!-- Scripts — no external dependencies -->
<script src="js/site.js?v=4"></script>
<script src="js/fireflies.js?v=4"></script>
<script src="js/crypto-random.js?v=4"></script>
<script src="js/user-entropy.js?v=4"></script>
<script src="js/entropy.js?v=4"></script>
<script src="data/words.js?v=4"></script>
<script src="js/password-generator.js?v=4"></script>
<script src="js/passphrase-generator.js?v=4"></script>
<script src="js/agent-api.js?v=4"></script>
<script src="js/clipboard.js?v=4"></script>
<script src="js/ui.js?v=4"></script>
<script src="js/app.js?v=4"></script>
</body>
</html>
