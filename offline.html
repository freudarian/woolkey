<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline — WoolKey</title>
  <link rel="icon" type="image/png" href="assets/favicon.png">
  <link rel="stylesheet" href="css/main.css">
</head>
<body>
<header class="site-header">
  <a href="./" class="logo">WoolKey</a>
  <div class="theme-switcher" role="group" aria-label="Theme">
    <button type="button" class="theme-btn" data-theme-choice="light" aria-label="Light mode" title="Light mode">☀️</button>
    <button type="button" class="theme-btn" data-theme-choice="dark" aria-label="Dark mode" title="Dark mode">🌙</button>
    <button type="button" class="theme-btn" data-theme-choice="system" aria-label="System theme" title="System theme">💻</button>
  </div>
</header>
<main class="error-page">
  <h1>You're offline</h1>
  <p>WoolKey is designed to work offline — please visit the site once while online to cache the app.</p>
  <a href="./" class="btn btn-primary">Try again</a>
</main>
<footer class="site-footer">
  <span>© <span data-current-year></span> CoolerSheep</span>
</footer>
<script src="js/site.js"></script>
</body>
</html>
